# Packages the standalone AI assistant in ai-assistant/ (Node.js server and
# web UI) as a zip with its dependencies included. Unzip it on a PC or in
# Termux and run `node server/server.js`; no build step or npm is needed.

name: EditorA AI Assistant

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Also publish the package as a GitHub pre-release
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "ai-assistant/**"
      - ".github/workflows/ai-assistant.yml"
  pull_request:
    paths:
      - "ai-assistant/**"
      - ".github/workflows/ai-assistant.yml"

permissions:
  contents: read

# A newer push supersedes an older push run; a manual run, which may be
# publishing a release, is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    working-directory: ai-assistant

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-assistant/package-lock.json

      - name: Compute metadata
        id: meta
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE_VERSION=$(node -p 'require("./package.json").version')
          if ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Bad version::ai-assistant/package.json has version '$BASE_VERSION'."
            exit 1
          fi
          # The run number keeps releases in order; the commit says what was built.
          VERSION="$BASE_VERSION-$RUN_NUMBER.${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=editora-ai-assistant-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Package
        env:
          NAME: ${{ steps.meta.outputs.artifact_name }}
        run: |
          STAGE="$RUNNER_TEMP/$NAME"
          ZIP="$PWD/dist/$NAME.zip"
          mkdir -p "$STAGE" dist
          # Every tracked file except the tests, so new runtime files are
          # included without editing this list.
          git ls-files -z -- . ':!test' ':!vitest.config.js' | xargs -0 cp --parents -t "$STAGE"
          cd "$STAGE"
          npm ci --omit=dev --no-audit --no-fund
          # The tests are not shipped, and the CLI links are not needed.
          npm pkg delete scripts.test devDependencies
          rm -rf node_modules/.bin
          find node_modules -type d -empty -delete
          (cd "$RUNNER_TEMP" && zip -qr "$ZIP" "$NAME")

      - name: Verify package
        env:
          NAME: ${{ steps.meta.outputs.artifact_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ZIP="$PWD/dist/$NAME.zip"
          CHECK="$RUNNER_TEMP/check"
          mkdir -p "$CHECK"
          unzip -q "$ZIP" -d "$CHECK"
          cd "$CHECK/$NAME"

          # The model adapters load the bundled dependencies only when used.
          node --input-type=module -e '
            import { createModelAdapter, getProvider } from "./core/providers.js";
            for (const id of ["anthropic", "ollama"]) {
              await createModelAdapter({ provider: getProvider(id), model: "m", apiKey: "k" });
            }
            console.log("Both model adapters load.");
          '

          # Start the server from the unzipped package and load its state.
          ASSISTANT_HOME="$RUNNER_TEMP/home" ASSISTANT_TOKEN=check PORT=8790 node server/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER=$!
          READY=false
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 -H "Authorization: Bearer check" http://127.0.0.1:8790/api/state -o state.json; then
              READY=true
              break
            fi
            sleep 1
          done
          kill "$SERVER" 2>/dev/null || true
          if [ "$READY" != true ]; then
            echo "::error title=Server did not start::The packaged server did not answer within 30 seconds."
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi
          node -e '
            const state = JSON.parse(require("node:fs").readFileSync("state.json", "utf8"));
            if (!state.providers?.length) throw new Error("The server returned no providers.");
            console.log(`Server answered with ${state.providers.length} providers.`);
          '
          {
            echo "## EditorA AI Assistant"
            echo "| Key | Value |"
            echo "| --- | --- |"
            echo "| Version | $VERSION |"
            echo "| Size | $(du -h "$ZIP" | cut -f1) |"
            echo "| SHA-256 | $(sha256sum "$ZIP" | cut -d' ' -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ai-assistant/dist/${{ steps.meta.outputs.artifact_name }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "ai-assistant-v$VERSION" ./*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "EditorA AI Assistant $VERSION" \
            --notes "The standalone AI assistant (Node.js server and web UI) with its dependencies. Unzip it, then run node server/server.js in the folder (Node.js 20 or newer). Built from $GITHUB_SHA."
        working-directory: .
